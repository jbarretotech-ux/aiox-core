<script>
const D=24.6; window.END=23.5; const tl=gsap.timeline({paused:true}), E="expo.out";
function inLines(sel,t){tl.from(sel+" .line>span",{yPercent:110,duration:.6,ease:E,stagger:.08},t)}
function show(id,t){tl.set(id,{opacity:1},t)}
function hide(id,t){tl.to(id,{opacity:0,y:-60,duration:.3,ease:"power2.in"},t)}
function flash(t,c){tl.set("#flash",{background:c||"#ff6a1a"},t);tl.fromTo("#flash",{opacity:0},{opacity:.5,duration:.06,yoyo:true,repeat:1,ease:"none"},t)}
function kick(id,t){tl.from(id+" .k",{opacity:0,x:-40,duration:.4,ease:E},t)}
function shake(t,a){tl.fromTo("#stage",{x:0},{x:a||10,duration:.04,yoyo:true,repeat:5,ease:"none"},t)}
function steps(t,a,b,c){tl.from("#free",{scale:0,opacity:0,duration:.35,ease:"back.out(2)"},t+.1);tl.from("#st1",{x:-90,opacity:0,duration:.3,ease:E},a);tl.from("#st2",{x:-90,opacity:0,duration:.3,ease:E},b);tl.from("#st3",{x:-90,opacity:0,scale:.9,duration:.35,ease:"back.out(2)"},c);shake(c+.05)}
function cta(t,b){flash(t);show("#cta",t);inLines("#cta",t+.05);tl.from("#box",{scale:0,rotation:-8,duration:.55,ease:"back.out(1.8)"},b);tl.to("#box",{scale:1.06,duration:.4,yoyo:true,repeat:3,ease:"sine.inOut"},b+.6);tl.from("#cm",{y:120,opacity:0,duration:.6,ease:E},b+.9)}
tl.to("#glow",{x:120,y:-200,scale:1.15,duration:D,ease:"sine.inOut"},0);
function draw(sel,t,d){document.querySelectorAll(sel).forEach(p=>{const L=p.getTotalLength?p.getTotalLength():800;p.style.strokeDasharray=L;p.style.strokeDashoffset=L;tl.to(p,{strokeDashoffset:0,duration:d||.8,ease:"power1.inOut"},t)})}
show("#s1",0); inLines("#s1",.05); kick("#s1",0);
tl.from("#p1",{y:100,opacity:0,duration:.4,ease:E},.4);
draw("#bulb",.6,.9); draw("#bulb2",1.4,.6);
tl.from("#tx1",{opacity:0,duration:.2},2.0);
tl.fromTo("#pen1",{x:-260,y:300},{x:0,y:0,duration:1.4,ease:"sine.inOut"},.6);
hide("#s1",2.65);
flash(2.82); show("#s2",2.82); kick("#s2",2.82);
draw("#rob",2.9,1.0); draw("#hat",3.7,.6); draw("#spk",4.2,.4);
tl.from("#tx2",{opacity:0,y:20,duration:.3},4.5);

draw("#arr",7.6,.4);

hide("#s3",10.5);
flash(10.65); show("#s4",10.65); kick("#s4",10.65);
tl.from("#s4 .big",{scale:.6,opacity:0,duration:.5,ease:E},10.7);
const c={v:0};tl.to(c,{v:400,duration:1.6,ease:"power2.out",onUpdate:()=>{document.getElementById("cnt").textContent=Math.round(c.v)}},10.9);
draw("#circ",12.4,.7);
tl.from("#s4 .unit",{opacity:0,y:30,duration:.4,ease:E},12.3);
hide("#s4",15.3);
flash(15.45); show("#s_st",15.45); kick("#s_st",15.45); steps(15.45,16.8,17.85,18.75);
hide("#s_st",19.6);
cta(19.75,20.2);

tl.set({},{},D);
const CH=[];let cur=[];
W.forEach((w,i)=>{cur.push(i);if(/[.!?:,]$/.test(w[1])||cur.length===3){CH.push(cur);cur=[]}});if(cur.length)CH.push(cur);
const cap=document.getElementById("cap"), END=window.END;
function caption(t){
 let ci=-1;for(let k=0;k<CH.length;k++){if(W[CH[k][0]][0]<=t+0.02)ci=k}
 if(ci<0||t>END){cap.innerHTML="";return}
 const last=CH[ci][CH[ci].length-1];const ns=ci+1<CH.length?W[CH[ci+1][0]][0]:END;
 if(t>W[last][0]+0.9&&t<ns){cap.innerHTML="";return}
 cap.innerHTML=CH[ci].map(i=>`<span class="${W[i][0]<=t+0.02&&(i+1>=W.length||W[i+1][0]>t)?'on':''}">${W[i][1]}</span>`).join("");
}
window.DUR=D;
window.seek=t=>{tl.seek(t,false);caption(t);document.getElementById("bar").style.width=(t/D*100)+"%";document.getElementById("clock").textContent="00:"+String(Math.floor(t)).padStart(2,"0")};
window.seek(0);
